name: Backend tests

on:
  push:
    branches: [main, feat/mvp-foundation]
  pull_request:

permissions:
  contents: read

jobs:
  backend-tests:
    name: FastAPI tests (Python 3.12)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Check Supabase public JWT signing keys
        env:
          AUTH_JWKS_URL: https://bbrdiakvwocjblbymuyj.supabase.co/auth/v1/.well-known/jwks.json
        run: python scripts/check_jwks.py
